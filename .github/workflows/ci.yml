name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Sin dependencias: solo la biblioteca estándar.
      - name: Tests unitarios
        run: python -m unittest -v
      - name: Generar la web con los datos de ejemplo
        run: python -m web --api tests/fixtures --salida _site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis de filtros.js
        run: node --check web/assets/filtros.js
